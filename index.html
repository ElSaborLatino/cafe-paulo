<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Café Paulo - Artisan Coffee, Pastries & Breakfast</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #faf8f5;
      color: #2c2421;
      padding-bottom: 50px;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 40;
      background-color: rgba(250, 248, 245, 0.98);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #e6dfd5;
      padding: 10px 16px;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1.brand {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 400;
      letter-spacing: 0.05em;
      color: #3b2f2f;
      text-align: center;
      flex: 1;
    }
    .subtitle {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #7a6b63;
      font-weight: 600;
      text-align: center;
      margin-top: -2px;
      margin-bottom: 6px;
    }
    .lang-select {
      background: #ffffff;
      border: 1px solid #e6dfd5;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      color: #3b2f2f;
    }
    .nav-pills {
      display: flex;
      overflow-x: auto;
      gap: 6px;
      padding: 6px 0 2px;
      white-space: nowrap;
      scrollbar-width: none;
      border-top: 1px solid #f0ece4;
    }
    .nav-pills::-webkit-scrollbar { display: none; }
    .pill {
      background: #ffffff;
      border: 1px solid #e6dfd5;
      padding: 5px 10px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 500;
      color: #594a42;
      cursor: pointer;
    }
    .pill.active {
      background: #594a42;
      color: #ffffff;
      border-color: #594a42;
    }
    main {
      max-width: 650px;
      margin: 0 auto;
      padding: 16px;
    }
    section {
      margin-bottom: 24px;
      scroll-margin-top: 140px;
    }
    .category-title {
      background-color: #a67c52; /* Warm cafe accent color */
      color: #ffffff;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border-top-left-radius: 6px;
      border-top-right-radius: 6px;
    }
    .category-content {
      background: #ffffff;
      border: 1px solid #e6dfd5;
      border-top: none;
      border-bottom-left-radius: 6px;
      border-bottom-right-radius: 6px;
      padding: 2px 14px;
    }
    .menu-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #f5f2eb;
    }
    .menu-item:last-child { border-bottom: none; }
    .item-title { font-weight: 700; font-size: 13.5px; color: #2c2421; }
    .price-tag {
      border: 1.5px solid #594a42;
      background: #ffffff;
      padding: 3px 7px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      color: #594a42;
      white-space: nowrap;
    }
    footer {
      max-width: 650px;
      margin: 30px auto 0 auto;
      padding: 0 16px;
    }
    .allergy-banner {
      background-color: #fdf8f6;
      border: 1px solid #f5e6e0;
      border-radius: 6px;
      padding: 12px 16px;
      font-size: 11.5px;
      color: #8c4a32;
      line-height: 1.4;
      text-align: center;
    }
    .loading-notice {
      text-align: center;
      padding: 40px 16px;
      font-size: 13px;
      color: #7a6b63;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <div style="width: 50px;"></div>
      <h1 class="brand">café paulo</h1>
      <div>
        <select id="langSelect" onchange="changeLanguage(this.value)" class="lang-select">
          <option value="en">🇬🇧 EN</option>
          <option value="tr">🇹🇷 TR</option>
          <option value="pt">🇵🇹 PT</option>
          <option value="el">🇬🇷 EL</option>
        </select>
      </div>
    </div>
    <div class="subtitle">Artisan Coffee & Fresh Pastries</div>

    <div class="nav-pills" id="navPills"></div>
  </header>

  <main id="menuContainer">
    <div class="loading-notice" id="loadingNotice">Loading menu...</div>
  </main>

  <footer>
    <div class="allergy-banner trans-text" 
      data-en="⚠️ Allergy Advice: Please inform our staff of any food allergies or dietary requirements before ordering."
      data-tr="⚠️ Alerji Uyarısı: Sipariş vermeden önce lütfen personelimize herhangi bir gıda alerjinizi veya diyet kısıtlamanızı bildiriniz."
      data-pt="⚠️ Aviso de Alergias: Por favor, informe a nossa equipa sobre quaisquer alergias alimentares ou restrições dietéticas antes de fazer o pedido."
      data-el="⚠️ Σημείωση Αλλεργιών: Παρακαλούμε ενημερώστε το προσωπικό μας για τυχόν αλλεργίες ή διατροφικές απαιτήσεις πριν από την παραγγελία σας.">
      ⚠️ Allergy Advice: Please inform our staff of any food allergies or dietary requirements before ordering.
    </div>
  </footer>

  <script>
    // Replace with Café Paulo's dedicated Google Sheet published CSV URL
    const MENU_CSV_URL = "YOUR_CAFE_PAULO_CSV_URL_HERE";

    let currentLanguage = 'en';
    let menuData = [];

    function parseCSVLine(line) {
      const result = [];
      let current = '';
      let inQuotes = false;

      for (let i = 0; i < line.length; i++) {
        const char = line[i];
        if (char === '"') {
          inQuotes = !inQuotes;
        } else if (char === ',' && !inQuotes) {
          result.push(current.trim());
          current = '';
        } else {
          current += char;
        }
      }
      result.push(current.trim());
      return result.map(str => str.replace(/^"|"$/g, '').trim());
    }

    async function fetchAndRenderMenu() {
      try {
        const response = await fetch(MENU_CSV_URL);
        const csvText = await response.text();
        
        const lines = csvText.split('\n').filter(line => line.trim() !== '');
        if (lines.length < 2) return;

        menuData = [];

        for (let i = 1; i < lines.length; i++) {
          const cols = parseCSVLine(lines[i]);
          
          if (cols.length < 3 || !cols[1]) continue;

          menuData.push({
            category: cols[0],
            name: cols[1],
            price: cols[2]
          });
        }

        renderPills();
        renderMenu();
      } catch (err) {
        document.getElementById('loadingNotice').innerText = "Unable to load live menu. Please check internet connection.";
        console.error("Error loading CSV feed:", err);
      }
    }

    function renderPills() {
      const navPills = document.getElementById('navPills');
      const categories = [...new Set(menuData.map(item => item.category))];
      
      navPills.innerHTML = categories.map((cat, idx) => `
        <button class="pill ${idx === 0 ? 'active' : ''}" onclick="scrollToCat('${slugify(cat)}', this)">
          <span>${cat}</span>
        </button>
      `).join('');
    }

    function renderMenu() {
      const container = document.getElementById('menuContainer');
      const categories = [...new Set(menuData.map(item => item.category))];

      container.innerHTML = categories.map(cat => {
        const catItems = menuData.filter(item => item.category === cat);

        return `
          <section id="${slugify(cat)}">
            <div class="category-title">
              <span>${cat}</span>
            </div>
            <div class="category-content">
              ${catItems.map(item => `
                <div class="menu-item">
                  <div class="item-title">${item.name}</div>
                  <div class="price-tag">${item.price}</div>
                </div>
              `).join('')}
            </div>
          </section>
        `;
      }).join('');
    }

    function slugify(text) {
      return text.toLowerCase().replace(/[^a-z0-9]/g, '-');
    }

    function scrollToCat(id, element) {
      document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
      element.classList.add('active');

      const target = document.getElementById(id);
      if (target) {
        const headerOffset = 135;
        const elementPosition = target.getBoundingClientRect().top;
        const offsetPosition = elementPosition + window.pageYOffset - headerOffset;

        window.scrollTo({
          top: offsetPosition,
          behavior: 'smooth'
        });
      }
    }

    function changeLanguage(lang) {
      currentLanguage = lang;
      
      document.querySelectorAll('.trans-text').forEach(el => {
        if (el.dataset[lang]) {
          el.innerText = el.dataset[lang];
        }
      });
    }

    window.addEventListener('DOMContentLoaded', fetchAndRenderMenu);
  </script>
</body>
</html>
